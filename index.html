<!DOCTYPE html>
<html>
<head>
    <title>Student Admission Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            background: #f0f0f0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 5px;
        }

        .full {
            grid-column: 1 / -1;
        }

        button {
            background: blue;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Admission Form</h2>

    <form>
        <input type="text" placeholder="First Name" required>
        <input type="text" placeholder="Last Name" required>

        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Phone Number" required>

        <input type="date" aria-label="Date of Birth" required>

        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <select class="full" required>
            <option value="">Select Course</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>Mechanical</option>
        </select>

        <textarea class="full" placeholder="Address"></textarea>

        <button class="full" type="submit">Submit</button>
    </form>
</div>

</body>
</html>
